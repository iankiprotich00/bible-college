org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
# Run any Kotlin compilation inside Gradle itself, instead of a separate background "daemon" process.
# This avoids the "Could not connect to Kotlin compile daemon" error (often caused by firewalls, VPNs or antivirus).
kotlin.compiler.execution.strategy=in-process
