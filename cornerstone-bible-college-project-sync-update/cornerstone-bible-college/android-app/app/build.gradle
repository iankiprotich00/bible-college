plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cornerstone.portal.test'
    compileSdk 34

    defaultConfig {
        applicationId "org.cornerstone.portal.test"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1-test"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
